name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: no registry push, so pull requests validate the Dockerfile
      # without needing credentials.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: system-one-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image runs on musl. Without configuration the server must fail on
      # the missing API key (exit 1), not on a missing dynamic loader (exit 127),
      # which is what a glibc-only binary produces inside Alpine.
      - name: Smoke-run in Alpine runtime
        run: |
          set +e
          output=$(docker run --rm system-one-mcp:ci 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s' "$output" | grep -q 'SYSTEM_ONE_API_KEY is required but not set'

  scripts:
    name: python black-box tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build server
        run: cargo build

      # No LIVE=1 here on purpose: CI must never spend the upstream account.
      - name: Run black-box suite
        run: python scripts/run_all.py
